<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HTML 首页</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #121212; color: #ececec; font-family: sans-serif; padding: 12px 12px 24px; }
  a { color: inherit; text-decoration: none; }
  #head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  #siteName { flex: 1; font-size: 18px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { background: #2a2a2a; color: #ececec; border: 1px solid #3a3a3a; border-radius: 20px; padding: 7px 14px; font-size: 13px; }
  .btn:active { background: #3a3a3a; }
  .btn.gold { background: #d9a441; border-color: #d9a441; color: #1a1a1a; font-weight: bold; }
  #searchRow { display: flex; gap: 8px; margin-bottom: 10px; }
  #q { flex: 1; background: #1e1e1e; color: #ececec; border: 1px solid #3a3a3a; border-radius: 20px; padding: 9px 14px; font-size: 14px; outline: none; }
  #chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; background: #1e1e1e; border: 1px solid #333; color: #ccc; border-radius: 20px; padding: 7px 14px; font-size: 13px; white-space: nowrap; }
  .chip.on { background: #d9a441; border-color: #d9a441; color: #1a1a1a; font-weight: bold; }
  #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { background: #1e1e1e; border-radius: 10px; overflow: hidden; }
  .pic { position: relative; width: 100%; padding-top: 133%; background: #262626; }
  .pic img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
  .pic .nop { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 6px; font-size: 12px; color: #999; text-align: center; }
  .meta { padding: 7px 8px 9px; }
  .nm { font-size: 13px; line-height: 1.3; height: 34px; overflow: hidden; }
  .rk { font-size: 11px; color: #9a9a9a; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.web { display: flex; align-items: center; justify-content: center; min-height: 96px; padding: 12px; font-size: 14px; color: #d9a441; text-align: center; }
  #pager { display: none; justify-content: center; align-items: center; gap: 16px; margin-top: 16px; }
  #status { text-align: center; color: #9a9a9a; font-size: 13px; padding: 28px 0; }
  #foot { text-align: center; color: #666; font-size: 11px; margin-top: 20px; }
</style>
</head>
<body>
<div id="head">
  <div id="siteName">…</div>
  <button class="btn" id="pickTplBtn">换模板</button>
  <button class="btn" id="openWebBtn">打开原网页</button>
</div>
<div id="searchRow">
  <input id="q" type="search" placeholder="搜本站…" autocomplete="off">
  <button class="btn gold" id="searchBtn">搜索</button>
</div>
<div id="chips"></div>
<div id="grid"></div>
<div id="pager">
  <button class="btn" id="prevBtn">上一页</button>
  <span id="pageLabel"></span>
  <button class="btn" id="nextBtn">下一页</button>
</div>
<div id="status"></div>
<div id="foot">HTML 首页 · 点海报直接播 · 点「换模板」切换或导入本地模板，也可长按工具栏 HTML</div>
<script>
(function () {
  var hasBridge = (typeof AVBox !== 'undefined');
  var mode = 'home', curTid = '', curPg = 1, curKey = '', pageCount = 0;

  function esc(s) {
    s = (s === null || s === undefined) ? '' : String(s);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function $(id) { return document.getElementById(id); }
  function setStatus(t) { $('status').textContent = t || ''; }
  function showPager(on, label) {
    $('pager').style.display = on ? 'flex' : 'none';
    if (label !== undefined) $('pageLabel').textContent = label;
  }

  // vod_id 可能是 {"type":"browser","url":...} 的浏览器卡
  function browserOf(it) {
    try {
      var o = JSON.parse(it.vod_id || '');
      if (o && o.type === 'browser' && o.url) return o;
    } catch (e) {}
    return null;
  }
  function cardHtml(it) {
    var b = browserOf(it);
    if (b) {
      var label = esc(b.title || ('浏览器打开 ' + (it.vod_name || '')));
      return '<div class="card web" data-web="' + esc(b.url) + '">' + label + '</div>';
    }
    var pic = it.vod_pic || '';
    var picHtml = pic
      ? '<img src="' + esc(pic) + '" loading="lazy" onerror="this.style.display=\'none\'">'
      : '<div class="nop">' + esc(it.vod_name || '') + '</div>';
    return '<div class="card" data-id="' + esc(it.vod_id || '') + '" data-name="' + esc(it.vod_name || '') + '" data-pic="' + esc(pic) + '">'
      + '<div class="pic">' + picHtml + '</div>'
      + '<div class="meta"><div class="nm">' + esc(it.vod_name || '') + '</div>'
      + (it.vod_remarks ? '<div class="rk">' + esc(it.vod_remarks) + '</div>' : '')
      + '</div></div>';
  }
  function renderList(list) {
    list = list || [];
    if (!list.length) { $('grid').innerHTML = ''; setStatus('没有内容'); return; }
    setStatus('');
    var html = '';
    for (var i = 0; i < list.length; i++) html += cardHtml(list[i]);
    $('grid').innerHTML = html;
  }
  function renderChips(classes) {
    var html = '<span class="chip on" data-tid="">推荐</span>';
    for (var i = 0; i < (classes || []).length; i++) {
      html += '<span class="chip" data-tid="' + esc(classes[i].type_id) + '">' + esc(classes[i].type_name) + '</span>';
    }
    $('chips').innerHTML = html;
  }

  window.__onHome = function (data) {
    data = data || {};
    renderChips(data['class'] || []);
    renderList(data.list || []);
    mode = 'home'; curTid = ''; curPg = 1; pageCount = 0;
    showPager(false);
  };
  window.__onCategory = function (data) {
    data = data || {};
    renderList(data.list || []);
    mode = 'cat';
    pageCount = data.pagecount || data.total || 0;
    var label = '第 ' + curPg + ' 页' + (pageCount ? ' / 共 ' + pageCount + ' 页' : '');
    showPager(true, label);
  };
  window.__onSearch = function (data) {
    data = data || {};
    renderList(data.list || []);
    mode = 'search';
    showPager(false);
  };

  function loadHome() {
    setStatus('加载中…');
    if (hasBridge) AVBox.home();
  }

  $('chips').addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.getAttribute) return;
    var tid = t.getAttribute('data-tid');
    if (tid === null) return;
    var chips = document.querySelectorAll('#chips .chip');
    for (var i = 0; i < chips.length; i++) chips[i].classList.remove('on');
    t.classList.add('on');
    if (tid === '') { loadHome(); return; }
    curTid = tid; curPg = 1;
    setStatus('加载中…');
    if (hasBridge) AVBox.category(tid, 1);
  });
  $('grid').addEventListener('click', function (e) {
    var t = e.target;
    while (t && !t.getAttribute) t = t.parentNode;
    if (!t) return;
    var web = t.getAttribute && t.getAttribute('data-web');
    if (web) { if (hasBridge) AVBox.openWeb(web); return; }
    var card = t.closest ? t.closest('.card') : null;
    if (!card) return;
    var id = card.getAttribute('data-id');
    if (!id || !hasBridge) return;
    AVBox.openDetail(id, card.getAttribute('data-name') || '', card.getAttribute('data-pic') || '');
  });
  $('prevBtn').addEventListener('click', function () {
    if (mode !== 'cat' || curPg <= 1 || !hasBridge) return;
    curPg--;
    setStatus('加载中…');
    AVBox.category(curTid, curPg);
  });
  $('nextBtn').addEventListener('click', function () {
    if (mode !== 'cat' || !hasBridge) return;
    if (pageCount && curPg >= pageCount) return;
    curPg++;
    setStatus('加载中…');
    AVBox.category(curTid, curPg);
  });
  function doSearch() {
    var k = $('q').value.replace(/^\s+|\s+$/g, '');
    if (!k) { loadHome(); return; }
    curKey = k;
    setStatus('搜索中…');
    if (hasBridge) AVBox.search(k);
  }
  $('searchBtn').addEventListener('click', doSearch);
  $('q').addEventListener('keydown', function (e) { if (e.keyCode === 13) doSearch(); });
  $('openWebBtn').addEventListener('click', function () {
    if (hasBridge) AVBox.openWeb(AVBox.homeUrl());
  });
  $('pickTplBtn').addEventListener('click', function () {
    if (hasBridge && AVBox.pickTemplate) AVBox.pickTemplate();
  });

  try { $('siteName').textContent = hasBridge ? AVBox.siteName() : '网页源'; } catch (e) {}
  loadHome();
})();
</script>
</body>
</html>
